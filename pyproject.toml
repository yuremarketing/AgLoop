[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agloop"
version = "0.7.0"
description = "Serverless Git & Markdown Multi-Agent Orchestration Framework for heterogeneous LLM agents (e.g. Claude <-> Gemini War Room)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Yure Mark" }
]
keywords = ["agents", "multi-agent", "llm", "orchestration", "git", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control :: Git",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "GitPython>=3.1.43",
    "python-dotenv>=1.0.1",
    "litellm>=1.53,<2",
]

[project.urls]
Homepage = "https://github.com/yuremarketing/AgLoop"
Repository = "https://github.com/yuremarketing/AgLoop"
Issues = "https://github.com/yuremarketing/AgLoop/issues"

[project.optional-dependencies]
adk = [
    "google-adk>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
agloop = "main:main"
agloop-vigia = "scripts.vigia:main"
agloop-mcp = "core.mcp_server:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["core", "scripts"]

[tool.setuptools.package-data]
core = ["templates/*.md", "templates/gestao/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
